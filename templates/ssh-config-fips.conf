# SSH config for reaching FIPS mesh machines from outside the mesh.
# Public entry: VPS2 (23.182.128.51) runs sshd + FIPS; ProxyJump through it
# reaches any fd00::/8 mesh address. Mesh RTT is 300-1500 ms -> generous
# timeouts. First verified 2026-08-14 (docs/FIPS-INGRESS-GATE.md Phase 3);
# re-verified 2026-10-14 after dq05 got its own mesh identity.
#
# Usage: copy the block below into ~/.ssh/config on the external machine,
# replace IdentityFile with your key (authorized on both the VPS and the
# target machine), then: ssh dq05.fips / ssh t470.fips / ssh t14gen5.fips
#
# Target machines need tcp/22 open on fips0: drop
# /etc/fips/fips.d/ssh.nft containing `tcp dport 22 accept` (ansible fips
# role deploys this via fips_mesh_ssh_port).
#
# Addresses below are pinned (not resolved via .fips DNS) because the
# operator machine is outside the mesh and cannot query fips-dns. They are
# deterministic: fd || SHA-256(npub)[0:15]. To add a node: copy a block,
# set HostName to its fd00:: address, keep the alias under *.fips so the
# wildcard defaults below apply.

# Wildcard defaults for every mesh host — future nodes only need a
# HostName block to inherit all of this.
Host *.fips
    User c03rad0r
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ProxyJump vps2
    ConnectTimeout 30
    ServerAliveInterval 30
    ServerAliveCountMax 3

# Jump host — public entry into the mesh.
Host vps2
    HostName 23.182.128.51
    User root
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ServerAliveInterval 30
    ServerAliveCountMax 3

# DQ05 (c03rad0r-DQ05proplus) — mesh npub1gglv3cfrypldzferwfeaye67e6afez09z93d7jqy3wfkjv9rxwnq86v86t
# Own mesh identity since ~2026-09; before that it shared CobridorWave's.
Host dq05.fips
    HostName fdb0:bf34:d648:96ac:f65a:3fd6:358:710b

# T470 / CobridorWave — mesh npub1eak909yyj7w94p6ct5yzqh3cn2ysq5w2u70cdat90uqxezcdkyus9kac72
Host t470.fips cobrador.fips
    HostName fd97:77d4:cd27:a6ae:1b29:e92e:fd96:dee8

