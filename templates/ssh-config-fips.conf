# SSH config for reaching FIPS mesh machines from outside the mesh.
# Public entry: VPS2 (23.182.128.51) runs sshd + FIPS; ProxyJump through it
# reaches any fd00::/8 mesh address. Mesh RTT is 300-1500 ms -> generous
# timeouts. Verified working 2026-08-14 (docs/FIPS-INGRESS-GATE.md Phase 3).
#
# Usage: copy the block below into ~/.ssh/config on the external machine,
# replace IdentityFile with your key (authorized on both the VPS and the
# target machine), then: ssh dq05.fips / ssh t14gen5.fips
#
# Target machines need tcp/22 open on fips0: drop
# /etc/fips/fips.d/ssh.nft containing `tcp dport 22 accept` (ansible fips
# role deploys this via fips_mesh_ssh_port).

Host vps2
    HostName 23.182.128.51
    User root
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ConnectTimeout 30

# CobradorWave — mesh npub1eak909yyj7w94p6ct5yzqh3cn2ysq5w2u70cdat90uqxezcdkyus9kac72
# (aliased "dq05" in /etc/fips/hosts, "T470" on VPS2 — same machine)
Host dq05.fips t470.fips
    HostName fd97:77d4:cd27:a6ae:1b29:e92e:fd96:dee8
    User c03rad0r
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ProxyJump vps2
    ConnectTimeout 30
    ServerAliveInterval 15
    ServerAliveCountMax 4

# T14Gen5 laptop — mesh npub1srsllgfuxrmv7cwewu3yzak0gmth5ats989zv35t6sc9ctf4fr6syqufhh
Host t14gen5.fips
    HostName fd79:f451:67b1:8084:2b2a:5b1e:9110:26d0
    User c03rad0r
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ProxyJump vps2
    ConnectTimeout 30
    ServerAliveInterval 15
    ServerAliveCountMax 4
