---
# buzz_signal_bridge — install + run the Signal <-> Buzz group bridge as a
# systemd USER unit on the local machine (where signal-cli + manager
# hermes gateway live).
#
# Prereqs (verified by tasks):
#   - nak CLI at ~/.local/bin/nak (relay auth + event send/req)
#   - signal-cli JSON-RPC daemon on 127.0.0.1:8080
#
# Out-of-band (see PLAN-buzz-signal-bridge.md):
#   - buzz channels exist on the relay (owner key creates them)
#   - bridge npub + friend npubs are channel members (owner put-user)
#   - the bridge nsec is generated ONCE and kept — its npub is the channel
#     membership identity; regeneration would orphan the membership.
- name: Verify nak CLI is available
  ansible.builtin.stat:
    path: "{{ buzz_signal_bridge_nak_path }}"
  register: nak_bin
  failed_when: not nak_bin.stat.exists

- name: Verify signal-cli JSON-RPC daemon port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ buzz_signal_bridge_signal_http.split(':')[2] | int }}"
    timeout: 10
  changed_when: false

- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ buzz_signal_bridge_install_dir }}"
    state: directory
    mode: "0755"

# --- manager gateway nostr config normalization (prerequisite) ------------
# The bridge design requires: (a) the manager nostr adapter healthy — its
# nsec_path in config.yaml used a tilde which nostr.py never expanduser's
# (adapter error-looped "nsec file not found"); (b) the bridged channels
# REMOVED from the adapter's groups so the gateway doesn't double-answer
# alongside the bridge.
- name: Stash one-time backup of manager config.yaml
  ansible.builtin.copy:
    src: "{{ buzz_signal_bridge_gateway_config }}"
    dest: "{{ buzz_signal_bridge_gateway_config }}.bak-buzzbridge"
    remote_src: true
    mode: preserve
  when: not (buzz_signal_bridge_gateway_config ~ '.bak-buzzbridge') is exists

- name: Normalize nostr config (absolute nsec path, no bridged channels)
  ansible.builtin.shell: |
    set -o pipefail
    {{ buzz_signal_bridge_python }} - <<'PYEOF'
    import sys, yaml
    p = "{{ buzz_signal_bridge_gateway_config }}"
    ABS = "{{ buzz_signal_bridge_gateway_nsec_path }}"
    DROP = set("{{ buzz_signal_bridge_pairs | map(attribute='buzz_channel') | join(',') }}".split(","))
    cfg = yaml.safe_load(open(p))
    changed = False
    def fix(block):
        global changed
        if not isinstance(block, dict):
            return
        if block.get("nsec_path") != ABS:
            block["nsec_path"] = ABS; changed = True
        g = block.get("groups")
        if isinstance(g, list):
            keep = [x for x in g if x not in DROP]
            if len(keep) != len(g):
                block["groups"] = keep; changed = True
    fix(cfg.get("nostr"))
    fix(((cfg.get("platforms") or {}).get("nostr") or {}).get("extra"))
    if changed:
        with open(p, "w") as f:
            yaml.safe_dump(cfg, f, sort_keys=False, allow_unicode=True)
        print("CHANGED")
    else:
        print("OK")
    PYEOF
  register: nostr_cfg
  changed_when: nostr_cfg.stdout.strip() == "CHANGED"
  notify: restart hermes gateway

- name: Remove bridged channels from NOSTR_GROUPS env (manager profile)
  ansible.builtin.shell: |
    set -o pipefail
    f="{{ buzz_signal_bridge_manager_env }}"
    drop() { for g in "$@"; do sed -i "s/,$g//g; s/$g,//g; s/^NOSTR_GROUPS=$g$/NOSTR_GROUPS=/" "$f"; done; }
    grep -q '^NOSTR_GROUPS=' "$f" && drop {{ buzz_signal_bridge_pairs | map(attribute='buzz_channel') | join(' ') }}
    grep '^NOSTR_GROUPS=' "$f" | grep -qE 'e6616f1a|b5f8f21d' && echo CHANGED || echo OK
  register: nostr_env
  changed_when: nostr_env.stdout.strip() == "CHANGED"

- name: Ensure keys dir exists
  ansible.builtin.file:
    path: "{{ buzz_signal_bridge_keys_dir }}"
    state: directory
    mode: "0700"

- name: Install bridge daemon script
  ansible.builtin.copy:
    src: buzz_signal_bridge.py
    dest: "{{ buzz_signal_bridge_install_dir }}/buzz_signal_bridge.py"
    mode: "0755"
  notify: restart buzz signal bridge

- name: Generate bridge nsec (ONCE — npub is the channel identity)
  ansible.builtin.command:
    argv:
      - "{{ buzz_signal_bridge_nak_path }}"
      - key
      - generate
  register: bridge_nsec_gen
  changed_when: false
  no_log: true

- name: Persist bridge nsec if missing
  ansible.builtin.copy:
    content: "{{ bridge_nsec_gen.stdout | trim }}"
    dest: "{{ buzz_signal_bridge_keys_dir }}/{{ buzz_signal_bridge_nsec_name }}"
    mode: "0600"
  when: not (buzz_signal_bridge_keys_dir ~ '/' ~ buzz_signal_bridge_nsec_name) is exists
  no_log: true

- name: Record bridge npub (public, safe to keep)
  ansible.builtin.shell: |
    set -o pipefail
    {{ buzz_signal_bridge_nak_path }} key public "$(cat '{{ buzz_signal_bridge_keys_dir }}/{{ buzz_signal_bridge_nsec_name }}')"
  register: bridge_npub
  changed_when: false

- name: Persist bridge npub
  ansible.builtin.copy:
    content: "{{ bridge_npub.stdout | trim }}\n"
    dest: "{{ buzz_signal_bridge_keys_dir }}/{{ buzz_signal_bridge_npub_name }}"
    mode: "0644"
  changed_when: false

- name: Render bridge pair config
  ansible.builtin.template:
    src: buzz_signal_bridge.json.j2
    dest: "{{ buzz_signal_bridge_install_dir }}/{{ buzz_signal_bridge_config_name }}"
    mode: "0600"
  notify: restart buzz signal bridge

- name: Render systemd user unit
  ansible.builtin.template:
    src: buzz-signal-bridge.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ buzz_signal_bridge_unit_name }}"
    mode: "0644"
  notify: restart buzz signal bridge

- name: Enable + start bridge service
  ansible.builtin.systemd:
    name: "{{ buzz_signal_bridge_unit_name }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true

- name: Verify bridge is active
  ansible.builtin.systemd:
    name: "{{ buzz_signal_bridge_unit_name }}"
    scope: user
  register: bridge_state
  failed_when: bridge_state.status.ActiveState != "active"
  changed_when: false

- name: Bridge deployment summary
  ansible.builtin.debug:
    msg:
      - "bridge npub: {{ bridge_npub.stdout | trim }}"
      - "pairs: {{ buzz_signal_bridge_pairs | map(attribute='name') | join(', ') }}"
      - "relay: {{ buzz_signal_bridge_relay }}"
      - "unit: {{ buzz_signal_bridge_unit_name }} (user)"
