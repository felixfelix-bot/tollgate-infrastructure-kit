---
# ngit-ci dashboard — static Vite/vanilla-TS SPA proving what the coordinator
# has run. Served by the HOST's systemd Caddy (VPS2 has no Docker Caddy).
#
# The build is pinned to an exact commit of the published ngit repository so a
# re-run is reproducible; bump ngit_ci_dashboard_repo_version to ship a new one.
ngit_ci_dashboard_enabled: true
ngit_ci_dashboard_domain: "ci.{{ base_domain }}"

# Coordinator whose CI events the dashboard renders (NIP-C1). This is the
# signing key of the DQ05 coordinator (see the ngit_ci role).
ngit_ci_dashboard_coordinator_pubkey: "765cd47badcbbc4a38c7d0c57d5607663b484c20cd59773f9f7064487f9431e8"

# Published on ngit (NIP-34) — plain HTTPS git remote, no auth needed.
ngit_ci_dashboard_repo_url: "https://relay.ngit.dev/npub1xtzgnzzu88yfv9es3evykl3ympjz0gc3umy2e6rs3jazruhjyevqe63edh/ngit-ci-dashboard.git"
# refs/heads/main as published on relay.ngit.dev at deploy time.
ngit_ci_dashboard_repo_version: "22bcb25cf9fb4a9857bdab5d33ea1f06b7e9b7ae"

ngit_ci_dashboard_src_dir: "{{ tollgate_base_dir }}/src/ngit-ci-dashboard"
ngit_ci_dashboard_dist_dir: "{{ tollgate_static_dir }}/ci"
ngit_ci_dashboard_report_dir: "{{ tollgate_base_dir }}/ngit-ci-dashboard"
# git/npm run as root + `sudo -u` (Debian 13 rejects become_user ACLs).
ngit_ci_dashboard_owner: debian

# systemd Caddy owns :80/:443 on VPS2 (pitfall #23 — never `docker restart caddy`).
ngit_ci_dashboard_caddy_service: caddy
ngit_ci_dashboard_caddyfile: /etc/caddy/Caddyfile
ngit_ci_dashboard_caddy_marker: "NGIT-CI-DASHBOARD ROUTES"

ngit_ci_dashboard_force_build: false

# Playwright render check. Hard-fails when the SPA shell does not render.
# ngit_ci_dashboard_require_run_rows additionally hard-fails when the deployed
# page shows zero runs — leave it false until the coordinator has CI history
# (a request-required coordinator with no maintainer Service Request renders an
# empty, but healthy, run list), set it true to enforce the run-row gate.
ngit_ci_dashboard_require_run_rows: false
ngit_ci_dashboard_playwright_enabled: true
