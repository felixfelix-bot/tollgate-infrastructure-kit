---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: backup-instance
    image: geerlingguy/docker-debian12-ansible:latest
    command: /sbin/init
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  inventory:
    host_vars:
      backup-instance:
        tollgate_base_dir: /opt/tollgate
        backup_retention_days: 7
        backup_restic_password: "test-restic-password"
        backup_hermes_enabled: true
        backup_hermes_tenants:
          - name: alice
          - name: bob
        backup_rsync_vps2_enabled: false
verifier:
  name: ansible
...