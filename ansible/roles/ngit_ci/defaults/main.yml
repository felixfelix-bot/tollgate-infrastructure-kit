---
# ngit-ci coordinator (NIP-C1 actions runner) + docker-in-docker sidecar.
#
# Mirrors the hand-deployed coordinator on DQ05 (~/ngit-ci-deploy) into the kit,
# so the whole stack is reproducible from this repository alone:
#   * the coordinator image is built from the ngit-ci source staged on the host
#     at an exact commit (no hand-copied tree),
#   * the docker-in-docker sidecar isolates untrusted job containers from the
#     host daemon,
#   * /data (coordinator identity + event cache + queue state) is a named
#     volume, and the compose PROJECT NAME is pinned so the existing volume —
#     and therefore the existing signing identity — is reused, never replaced.
ngit_ci_enabled: true

# The single authorized coordinator identity. Every Service Request from the
# maintainer keys names this key; the role asserts it after start so a wrong or
# freshly-generated key can never silently become the coordinator.
ngit_ci_coordinator_hex: "765cd47badcbbc4a38c7d0c57d5607663b484c20cd59773f9f7064487f9431e8"
# Imported once, from the fleet secret store (SOPS/age, ADR-014) or the env.
# Never committed, never printed, never rotated on a normal run.
ngit_ci_coordinator_nsec: "{{ lookup('env', 'NGIT_CI_COORDINATOR_NSEC') | default('', true) }}"
# Opt-in one-shot: rewrite /data/.coordinator.nsec with ngit_ci_coordinator_nsec.
ngit_ci_force_identity: false

# Single active signer. The standby keeps the volume and config warm but the
# coordinator and dind containers are stopped.
ngit_ci_is_active: "{{ inventory_hostname == (ci_active_host | default(ngit_ci_primary_host | default('hermes-nvme'))) }}"

ngit_ci_owner: "{{ lookup('env', 'NGIT_CI_OWNER') | default('debian', true) }}"
# Compose project name is pinned: it decides the volume names
# (ngit-ci-deploy_coordinator-data) that hold the coordinator's nsec, so the
# existing identity volume is reused, never recreated under a new name.
ngit_ci_project_name: ngit-ci-deploy
ngit_ci_base_dir: "/home/{{ ngit_ci_owner }}/ngit-ci-deploy"
ngit_ci_src_dir: "/home/{{ ngit_ci_owner }}/ngit-ci-src"
ngit_ci_container_name: "{{ ngit_ci_project_name }}-coordinator-1"
ngit_ci_data_volume: "{{ ngit_ci_project_name }}_coordinator-data"
ngit_ci_dind_volume: "{{ ngit_ci_project_name }}_dind-storage"

# Upstream source. HEAD 0580b27 == v0.1.1 == the revision the live coordinator
# was built from (Dockerfile/Cargo.toml/docker-compose.yml md5-identical).
ngit_ci_repo_url: "https://gitnostr.com/npub15qydau2hjma6ngxkl2cyar74wzyjshvl65za5k5rl69264ar2exs5cyejr/ngit-ci.git"
ngit_ci_repo_version: "0580b27382b4fc9b6b3937d549a1cb2d125954fb"

# Repositories watched for kind-30617 announcements (npub/identifier).
# Union of the DQ05 anchor stack and the hermes-nvme stack, so moving CI off the
# local network does not drop any repository's coverage. `#TMBG` keys the
# tollgate-module-basic-go per-repo secrets.
ngit_ci_repos:
  - "npub1nng5mxkdh2mu593twukfr7j3fk5wxfy0v8ujf0e5g8nwwtzlphhqksqpew/balloon-fresh"
  - "npub1xtzgnzzu88yfv9es3evykl3ympjz0gc3umy2e6rs3jazruhjyevqe63edh/asymmetric-vanity-npubs"
  - "npub1xtzgnzzu88yfv9es3evykl3ympjz0gc3umy2e6rs3jazruhjyevqe63edh/bip39-dice-verify"
  - "npub1xtzgnzzu88yfv9es3evykl3ympjz0gc3umy2e6rs3jazruhjyevqe63edh/kanban-boards"
  - "npub1x677kgulh6lqaa8e658f9ts4s0x692wgrhcptw535877wfkuwnsqztaquc/feed"
  - "npub1nng5mxkdh2mu593twukfr7j3fk5wxfy0v8ujf0e5g8nwwtzlphhqksqpew/fips-design-session-2026-06-29"
