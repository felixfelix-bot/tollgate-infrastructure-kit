---
- name: Ensure logs dir exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.hermes/logs"
    state: directory
    mode: "0755"

- name: Deploy escalation check script
  ansible.builtin.copy:
    src: cost-escalation-check.py
    dest: "{{ hermes_cost_escalation_scripts_dir }}/cost-escalation-check.py"
    mode: "0755"

- name: Deploy aux-model audit script
  ansible.builtin.copy:
    src: aux-model-audit.py
    dest: "{{ hermes_cost_escalation_scripts_dir }}/aux-model-audit.py"
    mode: "0755"

- name: Ensure daily aux-model-audit cron line
  ansible.builtin.cron:
    name: aux-model-audit daily
    minute: "0"
    hour: "6"
    job: "/usr/bin/python3 {{ hermes_cost_escalation_scripts_dir }}/aux-model-audit.py >> {{ ansible_facts['env']['HOME'] }}/.hermes/logs/aux-model-audit.log 2>&1"
    state: present

- name: Run audit once to (re)generate the report
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ hermes_cost_escalation_scripts_dir }}/aux-model-audit.py"
  register: audit_run
  changed_when: false
