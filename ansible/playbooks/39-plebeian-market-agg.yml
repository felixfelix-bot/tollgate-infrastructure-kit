---
- name: Deploy Plebeian Market aggregator relay + WoT filter (relatr)
  hosts: "{{ target | default('vps2') }}"
  become: yes
  gather_facts: yes
  ignore_unreachable: true

  vars:
    market_agg_enabled: true
    market_agg_port: 7780
    market_wot_enabled: true
    market_wot_port: 3001

    strfry_agg_enabled: true
    strfry_agg_port: "{{ market_agg_port }}"
    strfry_agg_domain: "market-agg.{{ base_domain }}"
    strfry_agg_container: tollgate-strfry-market-agg
    strfry_agg_base_dir: "{{ tollgate_base_dir }}/strfry-market-agg"
    strfry_agg_state_dir: "{{ tollgate_base_dir }}/strfry-market-agg/state"
    strfry_agg_db_size_gb: 3
    strfry_agg_root_npub: "{{ lookup('env', 'MARKET_AGG_ROOT_NPUB') | default('npub1c03rad0r6q833vh57kyd3ndu2jry30nkr0wepqfpsm05vq7he25slryrnw', true) }}"
    strfry_agg_bootstrap_relays:
      - "wss://relay.damus.io"
      - "wss://nos.lol"
      - "wss://relay.{{ base_domain }}"
    strfry_agg_scrape_kinds:
      - 1
      - 3
      - 5
      - 6
      - 7
      - 1023
      - 1024
      - 1025
      - 1026
      - 10000
      - 10002
      - 30023
      - 30408
      - 30440
      - 30441
      - 30442

    relatr_enabled: true
    relatr_port: "{{ market_wot_port }}"
    relatr_domain: "market-wot.{{ base_domain }}"
    relatr_container_name: tollgate-relatr-market
    relatr_data_dir: "{{ tollgate_base_dir }}/relatr-market/data"
    relatr_plugins_dir: "{{ tollgate_base_dir }}/relatr-market/plugins"
    relatr_source_pubkey: "{{ lookup('env', 'MARKET_RELATR_SOURCE_HEX') | default('c3e23eb5e3d00f18b2f4f588d8cdbc548648be761bdd90812186df4603d7caa9', true) }}"
    relatr_nostr_relays: "wss://relay.{{ base_domain }},wss://relay.damus.io,wss://nos.lol"
    relatr_server_relays: "wss://relay.{{ base_domain }}"
    relatr_number_of_hops: 2
    relatr_trust_threshold: 0.1

  roles:
    - role: strfry_agg
      vars:
        strfry_agg_port: "{{ market_agg_port }}"
        strfry_agg_container: tollgate-strfry-market-agg
        strfry_agg_base_dir: "{{ tollgate_base_dir }}/strfry-market-agg"
        strfry_agg_state_dir: "{{ tollgate_base_dir }}/strfry-market-agg/state"
    - role: relatr
      vars:
        relatr_port: "{{ market_wot_port }}"
        relatr_container_name: tollgate-relatr-market
        relatr_data_dir: "{{ tollgate_base_dir }}/relatr-market/data"

  post_tasks:
    - name: Add Cloudflare DNS for market-agg
      command: >
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
        -H "Authorization: Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        -H "Content-Type: application/json"
        --data '{"type":"A","name":"market-agg.{{ base_domain }}","content":"{{ ansible_default_ipv4.address }}","proxied":true}'
        --max-time 10
      changed_when: false
      failed_when: false

    - name: Add Cloudflare DNS for market-wot
      command: >
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
        -H "Authorization: Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        -H "Content-Type: application/json"
        --data '{"type":"A","name":"market-wot.{{ base_domain }}","content":"{{ ansible_default_ipv4.address }}","proxied":true}'
        --max-time 10
      changed_when: false
      failed_when: false

    - name: Reload Caddy
      systemd:
        name: caddy
        state: reloaded
      failed_when: false

    - name: Market aggregator deployed
      debug:
        msg: >
          Market aggregator relay: wss://market-agg.{{ base_domain }} (strfry, port {{ market_agg_port }}).
          WoT filter: https://market-wot.{{ base_domain }} (relatr, port {{ market_wot_port }}).
          Root npub: {{ strfry_agg_root_npub }}.
          Scrape kinds: {{ strfry_agg_scrape_kinds | join(', ') }}.
          Next: point market app's ndk.ts at wss://market-agg.{{ base_domain }} as primary relay.
