---
- name: Deploy Nostr infrastructure (Tier 1 + Tier 2)
  hosts: vps1
  become: yes
  gather_facts: yes
  ignore_unreachable: true
  roles:
    # --- Base infrastructure ---
    - system
    - docker
    - cloudflare_dns
    - caddy
    # --- Tier 1: Core Nostr services ---
    - strfry
    - strfry_agg
    - obelisk_relay
    - blossom
    - nsite_gateway
    - ngit_relay
    - nsyte_cli
    # --- Tier 2: Useful supporting services ---
    - wot_sync
    - backup
    - relay_advertisement
    - grasp
  vars:
    blossom_mirror_enabled: false
    blossom_upload_max_size: 10485760
    strfry_agg_mapsize: "10G"
    docker_log_max_size: "50m"
    docker_log_max_file: "3"

# Tier 3 services are opt-in via individual playbooks:
#   11-mint-orchestrator, 16-cashu-brrr, 18-routstr, 13-fips,
#   33-jitsi-meet, 34-bitcoin-core, 21-syncthing, 27-act-runner, etc.
# Deploy with: ansible-playbook ansible/playbooks/NN-service.yml

- name: Deploy watchdog (local health monitor + auto-redeploy)
  hosts: localhost
  connection: local
  become: no
  gather_facts: yes
  roles:
    - watchdog
