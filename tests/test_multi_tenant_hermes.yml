---
# test_multi_tenant_hermes.yml
# Molecule test scenario for hermes_tenants Ansible role
#
# Tests:
#   1. Role runs without errors
#   2. Creates correct number of containers (3)
#   3. Creates 3 Docker networks (hermes-net-alice, hermes-net-bob, hermes-net-carol)
#   4. Creates 3 Docker volumes (hermes-alice-data, hermes-bob-data, hermes-carol-data)
#   5. Log config applied (json-file, max-size 10m, max-file 3)
#   6. Security: no-new-privileges set, no Docker socket mounted
#   7. Per-tenant directories, .env, docker-compose.yml exist
#
# Usage:
#   cd ansible/roles/hermes_tenants
#   molecule test
#   # or target this scenario specifically:
#   molecule test --scenario-name default
#
# Prerequisites:
#   - Docker available on the controller
#   - molecule + molecule-docker installed
#   - community.docker collection installed

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: hermes-tenants-instance
    image: geerlingguy/docker-debian12-ansible:latest
    command: /sbin/init
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  inventory:
    host_vars:
      hermes-tenants-instance:
        hermes_tenants_base_dir: /opt/tollgate/hermes
        hermes_tenants_deployment_admin_nsec: "nsec1testadminkeyplaceholder000000000000000000"
        hermes_tenants_tenants:
          - name: alice
            npub: "npub1alice0000000000000000000000000000000000000000000000000000"
            nsec: "nsec1alice000000000000000000000000000000000000000000000000000"
            zai_api_key: "test-key-alice"
          - name: bob
            npub: "npub1bob00000000000000000000000000000000000000000000000000000"
            nsec: "nsec1bob0000000000000000000000000000000000000000000000000000"
            zai_api_key: "test-key-bob"
          - name: carol
            npub: "npub1carol0000000000000000000000000000000000000000000000000000"
            nsec: "nsec1carol000000000000000000000000000000000000000000000000000"
            zai_api_key: "test-key-carol"
verifier:
  name: ansible