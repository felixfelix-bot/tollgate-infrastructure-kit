version: "3.9"

services:
  dm-issuer:
    build: .
    env_file: .env
    ports:
      - "8095:8095"
    volumes:
      - dm-issuer-data:/var/lib/dm-issuer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dm-issuer-data:
