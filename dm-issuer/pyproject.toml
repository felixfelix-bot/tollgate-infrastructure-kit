[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate-dm-issuer"
version = "0.1.0"
description = "Quote-handoff DM auto-issuance service: receives NIP-59 DM requests, marks mint quotes PAID via gRPC, DMs quote_id back to sender."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pynostr>=0.7.0",
    "coincurve>=20.0",
    "websockets>=12.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.scripts]
dm-issuer = "tollgate_dm_issuer.cli:main"
dm-issuer-service = "tollgate_dm_issuer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tollgate_dm_issuer = ["*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
omit = [
    "*/cdk_mint_rpc_pb2*.py",
    "*/cdk_mint_rpc_pb2_grpc.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]
